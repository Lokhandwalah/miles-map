name: miles_map
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.10.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  image_path: assets/images/icons/app_icon.png

flutter_native_splash:
  color: "#2B2F33"
  color_dark: "#2B2F33"
  image: assets/images/icons/app_icon.png
  image_dark: assets/images/icons/app_icon.png
  android_gravity: center
  # Android 12+ uses its own splash API: 1152x1152 canvas, artwork inside the
  # inner 768px circle (the OS masks anything outside it).
  android_12:
    color: "#2B2F33"
    color_dark: "#2B2F33"
    image: assets/images/icons/app_icon_android12.png
    image_dark: assets/images/icons/app_icon_android12.png

flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: false
    rive: false
    lottie: false
  assets:
    enabled: true
  fonts:
    enabled: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/icons/

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/sora/Sora-Thin.ttf
          weight: 100
        - asset: assets/fonts/sora/Sora-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/sora/Sora-Light.ttf
          weight: 300
        - asset: assets/fonts/sora/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/sora/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/sora/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/sora/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/sora/Sora-ExtraBold.ttf
          weight: 800
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm_sans/DMSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/dm_sans/DMSans-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/dm_sans/DMSans-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/dm_sans/DMSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/dm_sans/DMSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/dm_sans/DMSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/dm_sans/DMSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/dm_sans/DMSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/dm_sans/DMSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/dm_sans/DMSans-Black.ttf
          weight: 900
        - asset: assets/fonts/dm_sans/DMSans-BlackItalic.ttf
          weight: 900
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jet_brains_mono/JetBrainsMono-Thin.ttf
          weight: 100
        - asset: assets/fonts/jet_brains_mono/JetBrainsMono-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/jet_brains_mono/JetBrainsMono-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/jet_brains_mono/JetBrainsMono-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/jet_brains_mono/JetBrainsMono-Light.ttf
          weight: 300
        - asset: assets/fonts/jet_brains_mono/JetBrainsMono-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/jet_brains_mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jet_brains_mono/JetBrainsMono-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/jet_brains_mono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/jet_brains_mono/JetBrainsMono-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/jet_brains_mono/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/jet_brains_mono/JetBrainsMono-SemiBoldItalic.ttf
